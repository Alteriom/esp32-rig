; painlessMesh HIL agent firmware.
;
; The library version under test is pinned by git ref via the environment:
;   PAINLESSMESH_REF=Feat/next-release   (branch, tag, or commit SHA)
; CI passes the PR head so the rig tests exactly the code under review.
; flash_all.py defaults it to "main" for local runs if unset.
;
; One environment per artifact family (alteriom_hil.board.TARGET_CHIPS and
; build_artifacts.TARGETS name the same set). ESP32 variants with a native
; USB-Serial/JTAG port (C3, C5, C6, S3) put the agent console on that port,
; so connect those boards through their "USB" connector, not "UART".

[platformio]
src_dir = src

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_ldf_mode = deep+
lib_deps =
    bblanchon/ArduinoJson@^7
    arkhipenko/TaskScheduler
    AlteriomPainlessMesh=symlink://${sysenv.PAINLESSMESH_DIR}
build_flags =
    -D HIL_MESH_PREFIX=\"AlteriomHILMesh\"
    -D HIL_MESH_PORT=5555
    -D HIL_PAINLESSMESH_REF=\"${sysenv.PAINLESSMESH_REF}\"
    -D HIL_AGENT_SHA=\"${sysenv.HIL_AGENT_SHA}\"
    -D HIL_OTA_GENERATION=${sysenv.HIL_OTA_GENERATION}

; Shared by every ESP32-family environment.
[esp32_common]
platform = espressif32@7.0.1
lib_deps =
    ${env.lib_deps}
    esp32async/AsyncTCP

; The pinned espressif32 platform ships Arduino core 2.x, which predates the
; C5 and C6. Those two families build on pioarduino's platform (Arduino core
; 3.x, IDF 5). "stable" tracks pioarduino's latest release; pin a tag here
; the day a release changes behaviour on the rig.
[esp32_arduino3]
extends = esp32_common
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; Core 3.x guards its WiFi headers with SOC_WIFI_SUPPORTED (an sdkconfig
; macro the dependency finder cannot see). "deep+" evaluates such guards and
; then never attaches the Networking library to WiFi/AsyncTCP; plain "deep"
; follows every include.
lib_ldf_mode = deep

[native_usb]
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32]
extends = esp32_common
board = esp32dev
build_flags =
    ${env.build_flags}
    -D HIL_ARTIFACT_TARGET=\"esp32\"

[env:esp32-c3]
extends = esp32_common
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    ${native_usb.build_flags}
    -D HIL_ARTIFACT_TARGET=\"esp32-c3\"

[env:esp32-c5]
extends = esp32_arduino3
board = esp32-c5-devkitc-1
build_flags =
    ${env.build_flags}
    ${native_usb.build_flags}
    -D HIL_ARTIFACT_TARGET=\"esp32-c5\"

[env:esp32-c6]
extends = esp32_arduino3
board = esp32-c6-devkitc-1
build_flags =
    ${env.build_flags}
    ${native_usb.build_flags}
    -D HIL_ARTIFACT_TARGET=\"esp32-c6\"

[env:esp32-s3]
extends = esp32_common
board = esp32-s3-devkitc-1
; Build one conservative artifact that works on both N4 and larger S3 boards.
; The default devkit definition advertises 8 MB and boot-loops on 4 MB parts.
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
    ${env.build_flags}
    ${native_usb.build_flags}
    -D HIL_ARTIFACT_TARGET=\"esp32-s3\"

; ESP8266 (NodeMCU / ESP-12 module, 4 MB): UART bridge console, LittleFS for
; the role store and OTA staging (no NVS on this part), ESPAsyncTCP.
[env:esp8266]
platform = espressif8266
board = nodemcuv2
board_build.filesystem = littlefs
lib_deps =
    ${env.lib_deps}
    esp32async/ESPAsyncTCP
build_flags =
    ${env.build_flags}
    -D USE_FS_LITTLEFS
    -D HIL_ARTIFACT_TARGET=\"esp8266\"
