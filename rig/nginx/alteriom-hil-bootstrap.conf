server {
    listen 80;
    listen [::]:80;
    server_name __HIL_HOST__;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/alteriom-hil-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # Never expose the bearer-token dashboard over plaintext HTTP.
    location / {
        return 404;
    }
}
