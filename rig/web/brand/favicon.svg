<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The seedling, drawn for a browser tab: the same idea as mark.svg with
       the gradients, the glow and the leaves' pads left out, and every shape
       a little heavier, because at 16 pixels detail is only mud. Keep the
       two in step: a stem, a lit pad, two boards, a deck. -->
  <rect width="64" height="64" rx="14" fill="#111a18"/>
  <rect x="12" y="48" width="40" height="5" rx="2.5" fill="#1f3b34"/>
  <g transform="rotate(-34 30 36)"><rect x="16" y="29" width="17" height="11" rx="4" fill="#2a4c43"/></g>
  <g transform="rotate(34 34 28)"><rect x="31" y="21" width="17" height="11" rx="4" fill="#2a4c43"/></g>
  <path d="M32 48V38l3-3V22" fill="none" stroke="#63e6be" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="35" cy="17" r="6.5" fill="#63e6be"/>
</svg>
