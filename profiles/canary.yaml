# The Rig Health Check (profile `canary`): the farm validating itself.
#
# Every other profile answers "is this project's firmware good on this
# hardware". This one answers "is this hardware good", and it is the rig's
# own question -- so the firmware it flashes is the rig's own
# (Alteriom/esp32-hil-firmware, a release of which canary/firmware.json
# pins), carrying nothing from painlessMesh and nothing from a consumer. A
# red canary is never somebody's regression; it is an ESP, a cable, a hub,
# the rig's AP, its broker or its uplink.
#
# docs/canary.md is the firmware's protocol and the suite's checks;
# docs/artifact-first-plan.md step 3 is why it exists.

schema: 1
name: canary
label: Rig Health Check

source:
  # The suite is this repository's, like painlessMesh's; the firmware is
  # not. It lives in its own repository, with its own build, tests and
  # releases, so it can move when a family or a check changes and stay put
  # when the rig does. Nothing is fetched for a run: the bundle is pinned.
  location: farm
  repo: https://github.com/Alteriom/esp32-hil-firmware
  default_ref: main

build:
  # No command: nothing here builds the canary. Its repository does, on
  # every change and on each of its tags; a rig release pins one of those
  # releases (canary/firmware.json), fetches it, checks it against the
  # pin's digest and carries it, and `alteriom-hil-admin upgrade` installs
  # and pins it -- so the bundle a board is checked against is the one the
  # running rig was released with, the same for everyone on that release.
  #
  # A run therefore flashes a bundle or is refused at submit: the pinned
  # canary (what a health check names), or one an earlier run left for the
  # same commit.
  #
  # The firmware repository's commit the bundle was built from. `canary_sha`
  # -- the digest of the firmware's source -- travels in the manifest beside
  # it and is what a board reports over serial, but the revision of record
  # is the commit: it is what a bundle is reused by, what the dashboard
  # links, and what says which firmware a board's verdict belongs to.
  revision_key: farm_sha

flash:
  # The farm's own project-agnostic flasher: the canary supplies a build
  # script and gets flashing for free, which is the point of the contract.
  command:
    - "{python}"
    # The flasher is a module of the rig's distribution now, so it is run out
    # of the venv rather than from a path in the checkout
    # (docs/public-release-plan.md, step 12d).
    - -m
    - alteriom_hil.flash_artifacts
    - --artifacts
    - "{artifact_dir}"
    - --board-map
    - "{board_map}"
    - --revision-key
    - farm_sha

# No preflight. A preflight exists to skip a flash the boards do not need,
# by asking the firmware already on them what it is. The canary always
# flashes: it is checking the flash path itself, and a board left on a
# consumer's firmware from the last run is exactly the case a health check
# must not skip.

# The canary is built by the firmware repository's own release workflow and
# reaches the service by two roads: a rig release carries it (installed and
# pinned by `alteriom-hil-admin upgrade`), or it is handed over through the
# same upload a consumer's CI uses. The hand-over is accepted from this
# repository and this workflow only -- which is what fetched the pinned
# bundle -- and a bundle from anywhere else is refused.
supply:
  repo: https://github.com/Alteriom/esp32-rig
  workflow: .github/workflows/release.yml
  artifact: hil-canary

suite:
  path: suites/canary/tests
  # One board is a complete answer about that board. Every other suite here
  # needs peers; this one is per-board by nature, which is also what makes
  # "check this one board" a thing the farm can offer.
  min_boards: 1
  # It flashes, resets and takes over the radio of every board it is given,
  # so it cannot share the bank with a run under test.
  exclusive: true
  # Eight checks on six boards, with radio joins and a reset each: about six
  # minutes measured against nothing else running. The limit is there so a
  # wedged board cannot hold the farm, not to cut a failing check short of
  # its evidence.
  timeout_seconds: 900

env:
  # What the rig is, for the checks that need it: the AP the radio should
  # see and join, the broker the queue check publishes to, and the uplink
  # probe. Overridable per run, so one rig's names are not baked in.
  ALTERIOM_HIL_CANARY_REVISION: "{revision}"

report:
  # {version} is the firmware's own MAJOR.MINOR.PATCH (firmware/VERSION in
  # its repository and the commits that changed it), stamped into the bundle
  # by its build and repeated by the pin.
  title: "Rig Health Check {version}"
  capabilities: suites/canary/capabilities.json
