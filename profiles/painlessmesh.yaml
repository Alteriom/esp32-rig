# painlessMesh: the farm's first consumer.
#
# This document describes what farm_service.py used to hardcode. It is the
# reference for the schema in runner/profiles.py -- if a field here is unclear,
# that module is where it is validated and rendered.
#
# Behaviour must stay identical to the pre-profile service. painlessMesh is the
# production consumer and the release gate in docs/validation-matrix.md; this
# file is a description of a working pipeline, not a place to tune it.

schema: 1
name: painlessmesh
label: painlessMesh reference validation

source:
  # The suite lives in THIS repository, under suites/painlessmesh/, and that is
  # deliberate rather than legacy: painlessMesh is a public library and can hold
  # no credential for this private farm. The farm therefore owns the suite and
  # polls the library (see runner/watch_painlessmesh.py).
  location: farm
  repo: https://github.com/Alteriom/painlessMesh.git
  default_ref: main

build:
  # No command: nothing compiles on the rig (step 5 of
  # docs/artifact-first-plan.md). `hil-painlessmesh.yml` builds this matrix on
  # the simulation host -- x86, six PlatformIO cores, and not holding the rig
  # lock while it works -- and the run that dispatched it hands the bundle to
  # the service. `suites/painlessmesh/build_artifacts.py` is still the script
  # that builds it; the Pi is no longer one of the places that runs it.
  #
  # This one kept a fallback longest because it is the release gate, and the
  # fallback is what kept the gate quiet: a run that supplied nothing built
  # six families on the rig and passed, so this profile's supply path sat
  # unexercised for its first 105 runs with only the build stage saying so.
  # A run now flashes a bundle or is refused at submit, which is the failure
  # being visible rather than absorbed.
  #
  # The manifest key carrying the commit the build actually resolved to. A
  # branch is a moving name; every downstream stage is pinned to this.
  revision_key: painlessmesh_sha

flash:
  command:
    - "{python}"
    - suites/painlessmesh/flash_all.py
    - --artifacts
    - "{artifact_dir}"

preflight:
  # The HIL agent answers a JSON info command with the revision it is running,
  # which is what lets a re-run skip the flash when the boards already carry
  # this build. A profile running stock product firmware has no such protocol
  # and simply omits this section.
  command:
    - "{python}"
    - suites/painlessmesh/preflight.py
    - --board-map
    - "{board_map}"
    - --manifest
    - "{manifest}"
    - --out
    - "{preflight}"
    - --log-dir
    - "{log_dir}"
  timeout_seconds: 180

# The bundle this profile's runs flash is built by the farm's own HIL workflow,
# on the simulation host, and handed to the service by the run that dispatched
# it (docs/artifact-first-plan.md, step 2). The farm accepts a bundle only from
# this repository and this workflow, and only when its manifest names the
# commit the run asked for and the HIL agent the deployed suite speaks to.
# This is now the only way this profile gets firmware, apart from a bundle an
# earlier run already left for the same commit: with no build command there is
# nothing to fall back to, and a run with neither is refused when it is
# submitted, naming this workflow.
# The HIL agent: the firmware this suite's boards run so that the suite can
# talk to them. A bundle declares the digest of the agent source it was built
# from (`hil_agent_sha`), and the farm refuses one built from another -- it
# would speak a protocol the deployed suite does not. The farm used to know
# this directory by name; it is the profile's to say, so that another
# project's agent is held to its own and a profile with none is held to none.
agent:
  source_path: suites/painlessmesh/firmware

supply:
  repo: https://github.com/Alteriom/alteriom-esp32-farm
  workflow: .github/workflows/hil-painlessmesh.yml
  artifact: hil-firmware-matrix

suite:
  path: suites/painlessmesh/tests
  # A mesh needs peers: one board cannot form one, and the suite's own
  # assertions start at two.
  min_boards: 2
  # Takes the whole bank. A second run touching any board would corrupt the
  # mesh under test.
  exclusive: true
  # A healthy suite takes about fourteen minutes; a failing failover test adds
  # seven or more of waits and restores. The limit exists so a wedged fixture
  # cannot hold the farm, not to cut a failing run short of its evidence.
  timeout_seconds: 1800

env:
  PAINLESSMESH_REF: "{revision}"

report:
  title: "HIL painlessMesh {revision}"
  # What this suite claims to prove, keyed by the names its tests carry in
  # @pytest.mark.capability(...). This is the suite's statement, so it lives
  # beside the suite; it used to be a dict inside alteriom_hil.report, and
  # every consumer's report rendered it.
  capabilities: suites/painlessmesh/capabilities.json
