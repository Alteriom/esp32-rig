; Rig Health Check firmware (the farm's `canary` profile).
;
; Its version is MAJOR.MINOR from VERSION beside this file and PATCH from the
; commits that changed this directory; canary/build_artifacts.py stamps it in
; as CANARY_VERSION, and the board reports it in `boot` and `info`.
;
; One environment per artifact family (alteriom_hil.board.TARGET_CHIPS and
; canary/build_artifacts.TARGETS name the same set). ESP32 variants with a
; native USB-Serial/JTAG port (C3, C5, C6, S3) put the console on that port
; and on UART0 both, so either socket works -- see canary_platform.h.
;
; The canary depends on the Arduino core, ESP-IDF and ArduinoJson, and on
; nothing else. It carries no painlessMesh and no consumer code by design: a
; red canary must mean the ESP or the rig, never somebody's regression. Its
; one dependency and its platforms are pinned to exact releases for the same
; reason every other build here is -- the canary is the farm's own reference,
; so two builds of one commit must be the same firmware.

[platformio]
src_dir = src

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    bblanchon/ArduinoJson@7.4.3
build_flags =
    -D CANARY_SHA=\"${sysenv.CANARY_SHA}\"
    -D CANARY_VERSION=\"${sysenv.CANARY_VERSION}\"
    ; The core says why a station link dropped at WARN
    ; ("Reason: 201 - NO_AP_FOUND"). The rig keeps every serial line and the
    ; host parser ignores the non-JSON ones, so the reason costs nothing and
    ; is exactly what a radio check that failed needs to explain itself.
    -D CORE_DEBUG_LEVEL=2

[esp32_common]
platform = espressif32@7.0.1

; The pinned espressif32 platform ships Arduino core 2.x, which predates the
; C5 and C6. Those two families build on pioarduino's platform (Arduino core
; 3.x, IDF 5), pinned to a release tag rather than "stable": a moving URL
; means the same commit builds different firmware on different days.
; 55.03.311 = Arduino 3.3.11 / IDF 5.5.5.
[esp32_arduino3]
extends = esp32_common
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
; Core 3.x guards its WiFi headers with SOC_WIFI_SUPPORTED, an sdkconfig
; macro the dependency finder cannot see; "deep" follows every include.
lib_ldf_mode = deep

[native_usb]
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32]
extends = esp32_common
board = esp32dev
build_flags =
    ${env.build_flags}
    -D CANARY_TARGET=\"esp32\"

[env:esp32-c3]
extends = esp32_common
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    ${native_usb.build_flags}
    -D CANARY_TARGET=\"esp32-c3\"

[env:esp32-c5]
extends = esp32_arduino3
board = esp32-c5-devkitc-1
build_flags =
    ${env.build_flags}
    ${native_usb.build_flags}
    -D CANARY_TARGET=\"esp32-c5\"

[env:esp32-c6]
extends = esp32_arduino3
board = esp32-c6-devkitc-1
build_flags =
    ${env.build_flags}
    ${native_usb.build_flags}
    -D CANARY_TARGET=\"esp32-c6\"

; One conservative artifact that works on both N4 and larger S3 boards. The
; default devkit definition advertises 8 MB and boot-loops on 4 MB parts.
[env:esp32-s3]
extends = esp32_common
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
    ${env.build_flags}
    ${native_usb.build_flags}
    -D CANARY_TARGET=\"esp32-s3\"

; ESP8266 (NodeMCU / ESP-12 module, 4 MB): UART bridge console, and LittleFS
; for the key/value check because the part has no NVS. Station only, as the
; leaf spec requires -- the canary never brings up an AP on any family.
[env:esp8266]
platform = espressif8266
board = nodemcuv2
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
    -D CANARY_TARGET=\"esp8266\"
