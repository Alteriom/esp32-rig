<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">How a rig works</title>
  <desc id="d">Your CI builds a firmware bundle and hands it to the rig, or the rig fetches it from GitHub. The rig flashes the boards on its USB hub, runs your suite against them, keeps the evidence and answers with a verdict. A farm portal is optional: a rig connects out to it.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#63e6be"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8fa8a0"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1714"/><stop offset=".4" stop-color="#080d0c"/><stop offset="1" stop-color="#0b1110"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14201d"/><stop offset="1" stop-color="#101816"/></linearGradient>
  </defs>
  <rect width="960" height="470" rx="16" fill="url(#bg)"/>

  <!-- Your side -->
  <text x="40" y="44" fill="#63e6be" font-size="11" font-weight="700" letter-spacing="2.5">YOUR PROJECT</text>
  <rect x="40" y="60" width="220" height="92" rx="12" fill="url(#card)" stroke="#283a35"/>
  <text x="58" y="88" fill="#edf7f3" font-size="15" font-weight="650">A GitHub repository</text>
  <text x="58" y="110" fill="#8fa8a0" font-size="12.5">firmware source, and a pytest</text>
  <text x="58" y="127" fill="#8fa8a0" font-size="12.5">suite for real boards</text>
  <rect x="40" y="186" width="220" height="112" rx="12" fill="url(#card)" stroke="#283a35"/>
  <text x="58" y="214" fill="#edf7f3" font-size="15" font-weight="650">Your CI</text>
  <text x="58" y="236" fill="#8fa8a0" font-size="12.5">builds the firmware the way it</text>
  <text x="58" y="253" fill="#8fa8a0" font-size="12.5">already does, into a bundle:</text>
  <text x="58" y="276" fill="#b8d8cf" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">manifest.json + images</text>
  <path d="M150 152v30" stroke="#8fa8a0" stroke-width="1.6" fill="none" marker-end="url(#m)"/>
  <text x="158" y="172" fill="#8fa8a0" font-size="11">on every push</text>

  <!-- The rig -->
  <text x="340" y="44" fill="#63e6be" font-size="11" font-weight="700" letter-spacing="2.5">THE RIG</text>
  <rect x="340" y="60" width="300" height="306" rx="14" fill="url(#card)" stroke="#63e6be" stroke-opacity=".45"/>
  <text x="360" y="90" fill="#edf7f3" font-size="15" font-weight="650">A Raspberry Pi and this software</text>
  <text x="360" y="110" fill="#8fa8a0" font-size="12.5">one service: a queue, the boards, the evidence</text>
  <g font-size="12.5" fill="#edf7f3">
    <rect x="360" y="128" width="124" height="34" rx="8" fill="#16211e" stroke="#283a35"/><text x="372" y="150">1 · bundle</text>
    <rect x="496" y="128" width="124" height="34" rx="8" fill="#16211e" stroke="#283a35"/><text x="508" y="150">2 · discover</text>
    <rect x="360" y="172" width="124" height="34" rx="8" fill="#16211e" stroke="#283a35"/><text x="372" y="194">3 · flash</text>
    <rect x="496" y="172" width="124" height="34" rx="8" fill="#16211e" stroke="#283a35"/><text x="508" y="194">4 · your suite</text>
    <rect x="360" y="216" width="260" height="34" rx="8" fill="#16211e" stroke="#283a35"/><text x="372" y="238">5 · report: verdict, JUnit, serial logs</text>
  </g>
  <line x1="360" y1="266" x2="620" y2="266" stroke="#283a35"/>
  <circle cx="368" cy="287" r="4" fill="#63e6be"/>
  <text x="380" y="291" fill="#edf7f3" font-size="12.5">Rig Health Check first</text>
  <text x="380" y="308" fill="#8fa8a0" font-size="11.5">its own firmware proves every board is fit</text>
  <circle cx="368" cy="332" r="4" fill="#63e6be"/>
  <text x="380" y="336" fill="#edf7f3" font-size="12.5">A dashboard and an API</text>
  <text x="380" y="353" fill="#8fa8a0" font-size="11.5">port 8090 · a key per person and per CI</text>

  <!-- CI and the rig -->
  <path d="M260 238h74" stroke="#63e6be" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="270" y="228" fill="#63e6be" font-size="11.5" font-weight="650">bundle</text>
  <path d="M334 286h-68" stroke="#63e6be" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="272" y="306" fill="#63e6be" font-size="11.5" font-weight="650">verdict</text>
  <path d="M262 106h72" stroke="#8fa8a0" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#m)"/>
  <text x="268" y="84" fill="#8fa8a0" font-size="11">or fetched</text>
  <text x="268" y="98" fill="#8fa8a0" font-size="11">from GitHub</text>

  <!-- Boards -->
  <text x="720" y="44" fill="#63e6be" font-size="11" font-weight="700" letter-spacing="2.5">THE BOARDS</text>
  <rect x="720" y="60" width="200" height="306" rx="14" fill="url(#card)" stroke="#283a35"/>
  <text x="740" y="90" fill="#edf7f3" font-size="15" font-weight="650">A powered USB hub</text>
  <text x="740" y="110" fill="#8fa8a0" font-size="12.5">real silicon, flashed per run</text>
  <g font-size="12.5" fill="#edf7f3">
    <rect x="740" y="128" width="160" height="30" rx="7" fill="#16211e" stroke="#283a35"/><circle cx="756" cy="143" r="4" fill="#63e6be"/><text x="768" y="148">ESP32</text>
    <rect x="740" y="166" width="160" height="30" rx="7" fill="#16211e" stroke="#283a35"/><circle cx="756" cy="181" r="4" fill="#63e6be"/><text x="768" y="186">ESP32-C3</text>
    <rect x="740" y="204" width="160" height="30" rx="7" fill="#16211e" stroke="#283a35"/><circle cx="756" cy="219" r="4" fill="#63e6be"/><text x="768" y="224">ESP32-C5 · C6</text>
    <rect x="740" y="242" width="160" height="30" rx="7" fill="#16211e" stroke="#283a35"/><circle cx="756" cy="257" r="4" fill="#63e6be"/><text x="768" y="262">ESP32-S3</text>
    <rect x="740" y="280" width="160" height="30" rx="7" fill="#16211e" stroke="#283a35"/><circle cx="756" cy="295" r="4" fill="#63e6be"/><text x="768" y="300">ESP8266</text>
  </g>
  <text x="740" y="340" fill="#8fa8a0" font-size="11.5">serial, reset and radio,</text>
  <text x="740" y="355" fill="#8fa8a0" font-size="11.5">every line captured</text>
  <path d="M640 170h74" stroke="#63e6be" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="656" y="160" fill="#63e6be" font-size="11.5" font-weight="650">flash</text>
  <path d="M714 214h-68" stroke="#63e6be" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="654" y="234" fill="#63e6be" font-size="11.5" font-weight="650">serial</text>

  <!-- Optional farm -->
  <rect x="340" y="398" width="580" height="48" rx="12" fill="none" stroke="#8fa8a0" stroke-opacity=".6" stroke-dasharray="6 5"/>
  <text x="360" y="427" fill="#edf7f3" font-size="13.5" font-weight="650">Optional: a farm portal</text>
  <text x="530" y="427" fill="#8fa8a0" font-size="12.5">the rig connects out to it; its page there is the same page</text>
  <path d="M490 366v26" stroke="#8fa8a0" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#m)"/>
  <text x="40" y="427" fill="#8fa8a0" font-size="12.5">Standalone by default.</text>
</svg>
