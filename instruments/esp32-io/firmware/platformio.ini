; The farm's first I/O instrument: an ESP32 whose pins are test equipment.
;
; It carries no library under test and no consumer code: an instrument that
; misreads a pin must be the instrument's fault or the wiring's, never a
; regression somebody else shipped. Like the canary, its one dependency and
; its platform are pinned to exact releases.
;
; See docs/io-instrument.md for the parts, the wiring and how to register it.

[platformio]
src_dir = src

[env:esp32-io]
platform = espressif32@7.0.1
framework = arduino
board = esp32dev
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    bblanchon/ArduinoJson@7.4.3
build_flags =
    -D INSTRUMENT_SHA=\"${sysenv.INSTRUMENT_SHA}\"
